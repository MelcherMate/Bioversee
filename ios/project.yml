name: Bioversee
options:
  bundleIdPrefix: com.bioversee
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0
targets:
  Bioversee:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Bioversee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bioversee.app
        PRODUCT_NAME: Bioversee
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Bioversee/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    dependencies:
      - package: Supabase
        product: Supabase
schemes:
  Bioversee:
    build:
      targets:
        Bioversee: all
    run:
      config: Debug
    archive:
      config: Release
