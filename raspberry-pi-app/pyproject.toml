[project]
name = "bioversee-pi"
version = "1.3.0"
description = "Bioversee Raspberry Pi desktop setup app and monitoring agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "tomli-w>=1.0.0",
  "customtkinter>=5.2.0",
]

[project.optional-dependencies]
pi = [
  "gpiozero>=2.0",
  "lgpio>=0.2; platform_machine == 'aarch64' or platform_machine == 'armv7l'",
]

[project.scripts]
bioversee = "bioversee_pi.wizard.gui:main"
bioversee-wizard = "bioversee_pi.wizard.gui:main"
bioversee-agent = "bioversee_pi.agent.main:main"
bioversee-update = "bioversee_pi.updater:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bioversee_pi*"]
